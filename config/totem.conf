CONFIG_ZMK_USB_LOGGING=n

# Bluetooth / USB device name (max 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="TOTEM MOCY"

# Power saving
# Idle state (reduced scan/BLE activity) after 5 min of inactivity (in ms)
CONFIG_ZMK_IDLE_TIMEOUT=300000
# Deep sleep after 10 min of inactivity (in ms); any key press wakes the half
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
